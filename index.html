<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hell&rsquo;s Cabinet</title>
    <meta name="description" content="One historical crisis a day. Six seats to fill, and whoever the draft happens to offer you. Great power, questionable personnel." />

    <!--
      The mark is Nixon, which is the only face in the game that can end a run on
      sight. Official White House portrait, a work of the US federal government
      and public domain. It is tinted here to the same treatment every portrait
      gets in the game, because a favicon cannot inherit the stylesheet.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The game travels by shared link, so the card it unfurls into is not decoration. -->
    <meta property="og:title" content="Hell&rsquo;s Cabinet" />
    <meta property="og:description" content="One historical crisis a day. Six seats to fill, and whoever the draft happens to offer you." />
    <meta property="og:type" content="website" />
    <!-- Absolute: several scrapers will not resolve a relative og:image. -->
    <meta property="og:url" content="https://hellscabinet.com/" />
    <meta property="og:image" content="https://hellscabinet.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f7f3e7" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
